# 保健功效設定。測試版只有 glycemic 為 enabled: true。
# 標示「待填」的欄位必須由維護人員查證食藥署公告原文後填寫，不可由 AI 產生。
- code: glycemic
  name_zh: 調節血糖
  enabled: true
  evaluation_method:
    name: 健康食品之調節血糖保健功效評估方法
    announced: 2026-08-20
    url: https://www.fda.gov.tw/TC/news.aspx?cid=3&pn=2   # 待換成公告本文連結
    requirements: 待填   # 受試人數、試驗期間、評估指標，依公告附件填寫
  # 2026-10-07 修訂：原式以 ferment*、lactobacill* 為條件，會大量抓到腸道菌發酵與益生菌研究；改為發酵食品用語
  search_query: >-
    ("fermented"[tiab] OR koji[tiab] OR kombucha[tiab] OR natto[tiab] OR kimchi[tiab]
    OR tempeh[tiab] OR kefir[tiab] OR yogurt[tiab] OR yoghurt[tiab] OR "red yeast rice"[tiab])
    AND (glucose[tiab] OR glycemic[tiab] OR glycaemic[tiab] OR HbA1c[tiab]
    OR "insulin resistance"[tiab] OR diabet*[tiab])
    AND open access[filter]
  max_candidates: 200
  checked_at: 2026-10-07
