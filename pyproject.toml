[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fermentation-db"
version = "0.2.0"
description = "發酵資料庫資料處理工具（測試版）"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.2", "jsonschema==4.23.0", "requests==2.32.3"]

[project.scripts]
fdb = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline", "pipeline.providers"]

[tool.setuptools.package-data]
pipeline = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
